<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Expo Tree Exhibitions</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at 50% 30%, #420812 0%, #200408 60%, #120204 100%);
      color: #ffffff;
      padding: 2rem;
    }
    .not-found-box {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--gold-500);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }
    .not-found-number {
      font-family: var(--font-cinzel);
      font-size: 6rem;
      font-weight: 900;
      color: var(--gold-400);
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
    }
    .not-found-box h2 {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 1rem;
    }
    .not-found-box p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.05rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .not-found-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="not-found-page">
    <div class="not-found-box">
      <img src="images/logo.svg" alt="Expo Tree Logo" style="height: 60px; margin-bottom: 1.5rem;" />
      <div class="not-found-number">404</div>
      <h2>This Stall Seems to Have Moved!</h2>
      <p>
        The page you are looking for might have been shifted to another venue or does not exist. Don’t worry, the grand exhibition is still underway!
      </p>
      <div class="not-found-actions">
        <a href="index.html" class="btn btn-gold">
          <span>Return to Home &amp; Exhibitions</span>
        </a>
        <a href="https://wa.me/9811175057" class="btn btn-whatsapp">
          <span>WhatsApp Helpline (9811175057)</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
