<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC868" />
      <stop offset="35%" stop-color="#FFF2B2" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="badgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#741221" />
      <stop offset="85%" stop-color="#3D0810" />
      <stop offset="100%" stop-color="#230509" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem -->
  <g transform="translate(10, 5)">
    <!-- Ornate Outer Ring -->
    <circle cx="45" cy="45" r="43" fill="url(#badgeGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="45" cy="45" r="38" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 2" />
    
    <!-- Tree Trunk & Branches -->
    <path d="M45 74 V42 M45 60 C38 54 30 58 24 50 C20 44 24 34 32 34 C30 28 34 22 42 20 C46 12 56 12 60 20 C68 22 72 28 70 34 C78 34 82 44 78 50 C72 58 64 54 57 60" stroke="url(#goldGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Leaves / Jewels on branches -->
    <circle cx="45" cy="16" r="3.2" fill="url(#goldGrad)" />
    <circle cx="32" cy="26" r="2.8" fill="url(#goldGrad)" />
    <circle cx="58" cy="26" r="2.8" fill="url(#goldGrad)" />
    <circle cx="22" cy="40" r="2.4" fill="url(#goldGrad)" />
    <circle cx="68" cy="40" r="2.4" fill="url(#goldGrad)" />
    <circle cx="45" cy="32" r="2.6" fill="url(#goldGrad)" />
    
    <!-- Hanging Lanterns -->
    <line x1="38" y1="46" x2="38" y2="54" stroke="url(#goldGrad)" stroke-width="1.2" />
    <polygon points="35,54 41,54 39,59 37,59" fill="url(#goldGrad)" />
    <line x1="52" y1="46" x2="52" y2="54" stroke="url(#goldGrad)" stroke-width="1.2" />
    <polygon points="49,54 55,54 53,59 51,59" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="115" y="44" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="800" letter-spacing="3" fill="url(#goldGrad)">EXPO TREE</text>
  <text x="117" y="66" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="7" fill="#EAD796">EXHIBITIONS</text>
  <text x="117" y="82" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="400" letter-spacing="1.5" fill="#D2B48C">DELHI NCR • LIFESTYLE &amp; FESTIVE</text>
</svg>
