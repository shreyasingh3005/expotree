<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 180" fill="none">
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#5E4304" />
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F39C12" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#E67E22" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D35400" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hanging Chain -->
  <line x1="40" y1="0" x2="40" y2="50" stroke="url(#brass)" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="40" cy="50" r="5" fill="none" stroke="url(#brass)" stroke-width="2" />
  
  <!-- Canopy Top -->
  <path d="M22 62 C22 55 58 55 58 62 L54 68 L26 68 Z" fill="url(#brass)" />
  <circle cx="40" cy="55" r="3" fill="url(#brass)" />

  <!-- Glow effect inside -->
  <circle cx="40" cy="98" r="28" fill="url(#lanternGlow)" />

  <!-- Glass & Lattice Frame -->
  <path d="M25 68 L15 95 L25 125 L55 125 L65 95 L55 68 Z" fill="#FFF9E6" fill-opacity="0.18" stroke="url(#brass)" stroke-width="2.5" />
  
  <!-- Intricate Lattice work -->
  <line x1="40" y1="68" x2="40" y2="125" stroke="url(#brass)" stroke-width="1.5" />
  <line x1="15" y1="95" x2="65" y2="95" stroke="url(#brass)" stroke-width="1.5" />
  <path d="M25 68 L40 95 L25 125 M55 68 L40 95 L55 125" stroke="url(#brass)" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Inner Diya Flame -->
  <ellipse cx="40" cy="95" rx="5" ry="10" fill="#FFD166" />
  <ellipse cx="40" cy="97" rx="2.5" ry="5" fill="#FFF" />

  <!-- Base & Tassel Pendant -->
  <path d="M25 125 L32 135 L48 135 L55 125 Z" fill="url(#brass)" />
  <circle cx="40" cy="140" r="4" fill="url(#brass)" />
  <path d="M40 144 L37 165 L43 165 Z" fill="url(#brass)" />
  <circle cx="40" cy="168" r="2.5" fill="url(#brass)" />
</svg>
